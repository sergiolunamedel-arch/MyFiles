<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f1a" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mis Archivos</title>
<style>
/* ══════════════════ RESET ══════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh;overflow-x:hidden;overscroll-behavior:none}

/* ══════════════════ THEMES ══════════════════ */
:root{
  --bg:#0f0f1a;--text:#c8c6d0;--accent:#e2b714;
  --card:#161627;--border:#252540;--surface:#1c1c32;--muted:#8886a0;
  --glow:rgba(226,183,20,.10);
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --radius:12px;
}
:root.light{
  --bg:#f5f3ee;--text:#2c2a26;--accent:#8b5e3c;
  --card:#ffffff;--border:#e0ddd5;--surface:#ede9e0;--muted:#8a8678;
  --glow:rgba(139,94,60,.07);
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font)}

/* ══════════════════ LAYOUT ══════════════════ */
body{display:flex;flex-direction:column;align-items:center;
  padding:0 0 80px}
.container{width:100%;max-width:560px;padding:0 16px}

/* ══════════════════ HEADER ══════════════════ */
.header{padding:32px 0 0;text-align:center}
.header-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
.header-icon{font-size:1.7rem}
.header h1{font-size:1.5rem;font-weight:800;color:var(--accent);letter-spacing:.4px}
.header-sub{font-size:.76rem;color:var(--muted);font-style:italic;letter-spacing:.3px;margin-top:2px}

/* ══════════════════ STATS ══════════════════ */
.stats-bar{display:flex;gap:1px;background:var(--border);border-radius:var(--radius);
  overflow:hidden;margin-top:20px}
.stat{flex:1;background:var(--card);padding:13px 6px;text-align:center}
.stat-val{display:block;font-size:1.1rem;font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums}
.stat-label{display:block;font-size:.62rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:.7px;margin-top:2px}

/* ══════════════════ CONTROLS ══════════════════ */
.controls{display:flex;gap:8px;margin-top:14px}
.search-wrap{flex:1;position:relative}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);
  color:var(--text);border-radius:10px;padding:10px 12px 10px 34px;font-size:.84rem;
  outline:none;font-family:var(--font);transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:.8rem;color:var(--muted);pointer-events:none}
.ctrl-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);
  border-radius:10px;width:40px;height:40px;font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0}
.ctrl-btn:active,.ctrl-btn.active{background:var(--accent);color:#fff;
  border-color:var(--accent)}

/* ══════════════════ SECTION LABEL ══════════════════ */
.section-label{font-size:.68rem;text-transform:uppercase;letter-spacing:1.2px;
  color:var(--muted);font-weight:700;margin:20px 0 10px 4px}

/* ══════════════════ FILE GRID ══════════════════ */
.file-grid{display:flex;flex-direction:column;gap:8px}

.file-card{display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;text-decoration:none;color:var(--text);
  transition:border-color .2s,transform .15s;position:relative;cursor:pointer}
.file-card:hover{border-color:var(--accent)}
.file-card:active{transform:scale(.98)}

.file-icon{font-size:1.6rem;flex-shrink:0;width:36px;text-align:center}
.file-info{flex:1;min-width:0}
.file-name{font-size:.92rem;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:.7rem;color:var(--muted);margin-top:3px}

.file-actions{display:flex;gap:6px;flex-shrink:0}
.file-btn{background:transparent;border:1px solid var(--border);border-radius:8px;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:.85rem;color:var(--muted);transition:all .2s}
.file-btn:hover{border-color:var(--accent);color:var(--accent)}
.file-btn.delete:hover{border-color:#e05555;color:#e05555}
.file-btn:active{transform:scale(.9)}

/* ══════════════════ EMPTY STATE ══════════════════ */
.empty-state{text-align:center;padding:52px 20px;color:var(--muted);
  font-style:italic;font-size:.9rem;line-height:1.8}
.empty-state .empty-icon{font-size:2.4rem;display:block;margin-bottom:10px;opacity:.4}

/* ══════════════════ SORT MENU ══════════════════ */
.sort-menu{position:fixed;bottom:64px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:6px;display:none;flex-direction:column;gap:2px;z-index:1100;
  min-width:170px;box-shadow:0 8px 32px rgba(0,0,0,.4);
  opacity:0;transition:all .22s}
.sort-menu.open{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
.sort-opt{padding:10px 14px;border-radius:8px;font-size:.81rem;cursor:pointer;
  color:var(--text);transition:background .12s;display:flex;align-items:center;gap:8px}
.sort-opt.active,
.sort-opt:hover{background:color-mix(in srgb,var(--accent) 13%,transparent);
  color:var(--accent)}

/* ══════════════════ BOTTOM NAV ══════════════════ */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  padding:8px 0 calc(env(safe-area-inset-bottom,4px) + 6px);
  display:flex;justify-content:center;gap:8px;z-index:999}
.nav-btn{background:var(--card);color:var(--muted);border:1px solid var(--border);
  border-radius:11px;padding:8px 18px;font-size:.74rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:all .18s;font-family:var(--font)}
.nav-btn:active{transform:scale(.95)}
.nav-btn.active,.nav-btn:hover{background:var(--accent);color:#fff;
  border-color:var(--accent)}

/* ══════════════════ OFFLINE BAR ══════════════════ */
.offline-bar{position:fixed;top:0;left:0;right:0;background:#ef4444;color:#fff;
  text-align:center;padding:5px;font-size:.72rem;font-weight:600;z-index:2000;
  transform:translateY(-100%);transition:transform .3s}
.offline-bar.show{transform:translateY(0)}

/* ══════════════════ FOOTER ══════════════════ */
footer{padding:28px 0 10px;font-size:.65rem;color:var(--muted);
  opacity:.45;text-align:center}

/* ══════════════════ DELETE CONFIRM ══════════════════ */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1200;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.confirm-overlay.open{opacity:1;pointer-events:auto}
.confirm-box{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:28px 28px 20px;max-width:320px;width:90%;
  box-shadow:0 12px 40px rgba(0,0,0,.5)}
.confirm-title{font-size:1rem;font-weight:700;margin-bottom:8px;color:var(--accent)}
.confirm-msg{font-size:.84rem;color:var(--muted);line-height:1.5;margin-bottom:20px}
.confirm-btns{display:flex;gap:8px;justify-content:flex-end}
.confirm-btn{border-radius:8px;padding:8px 18px;font-size:.82rem;font-weight:600;
  cursor:pointer;border:1px solid var(--border);font-family:var(--font);
  transition:all .18s}
.confirm-btn.cancel{background:transparent;color:var(--text)}
.confirm-btn.cancel:hover{border-color:var(--muted)}
.confirm-btn.danger{background:#e05555;color:#fff;border-color:#e05555}
.confirm-btn.danger:hover{background:#c94444}

/* ══════════════════ SCROLLBAR ══════════════════ */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ══════════════════ ANIMATIONS ══════════════════ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.file-card{animation:fadeUp .35s ease calc(var(--i,0) * 50ms) both}
</style>
</head>
<body>

<div class="offline-bar" id="offline-bar">Sin conexión — modo offline</div>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <span class="header-icon">🗂️</span>
      <h1>Mis Archivos</h1>
    </div>
    <div class="header-sub">Repositorio personal</div>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-val" id="st-total">0</span>
      <span class="stat-label">Archivos</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="st-size">0 KB</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="st-types">—</span>
      <span class="stat-label">Tipos</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search" type="text"
             placeholder="Buscar archivos…" autocomplete="off">
    </div>
    <button class="ctrl-btn" id="btn-sort" title="Ordenar">↕</button>
    <button class="ctrl-btn" id="btn-theme" title="Tema">◐</button>
  </div>

  <!-- File list -->
  <div class="section-label" id="lib-label">Archivos</div>
  <div class="file-grid" id="file-grid"></div>
  <div class="empty-state" id="empty-state" style="display:none">
    <span class="empty-icon">📭</span>
    No hay archivos todavía.<br>
    Usa el programa local para subir archivos.
  </div>

  <footer>MyFiles — sergiolunamedel-arch.github.io/MyFiles</footer>
</div>

<!-- Sort menu -->
<div class="sort-menu" id="sort-menu">
  <div class="sort-opt active" data-sort="date"    onclick="setSort('date')">🕐 Más recientes</div>
  <div class="sort-opt"        data-sort="name"    onclick="setSort('name')">🔤 Nombre</div>
  <div class="sort-opt"        data-sort="size"    onclick="setSort('size')">📦 Tamaño</div>
  <div class="sort-opt"        data-sort="type"    onclick="setSort('type')">🗂 Tipo</div>
</div>

<!-- Delete confirm modal -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">Eliminar archivo</div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel" onclick="closeConfirm()">Cancelar</button>
      <button class="confirm-btn danger"  id="confirm-ok">Eliminar</button>
    </div>
  </div>
</div>

<!-- Bottom nav -->
<div class="bottom-nav">
  <button class="nav-btn" id="nav-refresh" onclick="loadFiles()">🔄 Actualizar</button>
</div>

<script>
(function(){
'use strict';

/* ══════════ CONFIG ══════════ */
var REPO  = 'sergiolunamedel-arch/MyFiles';
var API   = 'https://api.github.com/repos/' + REPO + '/contents/files';
var RAW   = 'https://raw.githubusercontent.com/' + REPO + '/main/files/';
var TOKEN = '';   // NOT stored here — the uploader program handles auth
var currentSort = 'date';
var allFiles    = [];
var pendingDelete = null;

/* ══════════ HELPERS ══════════ */
function $(id){ return document.getElementById(id); }

function fmtSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

function fileIcon(name){
  var ext = (name.split('.').pop()||'').toLowerCase();
  var map = {
    pdf:'📄', doc:'📝', docx:'📝', xls:'📊', xlsx:'📊',
    ppt:'📋', pptx:'📋', txt:'📃', md:'📃',
    jpg:'🖼', jpeg:'🖼', png:'🖼', gif:'🖼', webp:'🖼', svg:'🖼',
    mp3:'🎵', wav:'🎵', ogg:'🎵', m4a:'🎵',
    mp4:'🎬', mov:'🎬', avi:'🎬', mkv:'🎬',
    zip:'🗜', rar:'🗜', gz:'🗜', '7z':'🗜',
    py:'🐍', js:'📜', html:'🌐', css:'🎨', json:'⚙️',
    csv:'📊', xml:'⚙️'
  };
  return map[ext] || '📁';
}

function fileType(name){
  var ext = (name.split('.').pop()||'').toUpperCase();
  return ext || 'FILE';
}

function timeAgo(dateStr){
  var ms = Date.now() - new Date(dateStr).getTime();
  var s  = Math.round(ms/1000);
  if(s < 60)  return 'Hace un momento';
  if(s < 3600) return 'Hace ' + Math.round(s/60) + ' min';
  if(s < 86400) return 'Hace ' + Math.round(s/3600) + ' h';
  return 'Hace ' + Math.round(s/86400) + ' d';
}

/* ══════════ LOAD FILES ══════════ */
function loadFiles(){
  var grid = $('file-grid');
  grid.innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted);font-size:.85rem">Cargando…</div>';
  $('empty-state').style.display = 'none';

  fetch(API + '?_=' + Date.now())
    .then(function(r){
      if(r.status === 404){
        // /files folder doesn't exist yet — show empty state
        allFiles = [];
        renderFiles();
        return;
      }
      return r.json().then(function(data){
        if(!Array.isArray(data)){
          allFiles = [];
        } else {
          allFiles = data.map(function(f){
            return {
              name: f.name,
              size: f.size,
              sha:  f.sha,
              download_url: f.download_url,
              html_url: f.html_url,
              // GitHub API doesn't give us dates; we approximate from commit history
              // The publisher will embed a timestamp in the filename or metadata
              date: extractDate(f.name) || new Date(0).toISOString()
            };
          });
        }
        renderFiles();
      });
    })
    .catch(function(){
      allFiles = [];
      renderFiles();
    });
}

function extractDate(name){
  // If publisher prefixes files with YYYYMMDD_, extract it
  var m = name.match(/^(\d{4})(\d{2})(\d{2})_/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3]+'T00:00:00Z';
  return null;
}

/* ══════════ RENDER ══════════ */
function renderFiles(){
  var query = $('search').value.toLowerCase().trim();
  var list  = allFiles.slice();

  if(query){
    list = list.filter(function(f){
      return f.name.toLowerCase().indexOf(query) > -1;
    });
  }

  if(currentSort === 'name'){
    list.sort(function(a,b){ return a.name.localeCompare(b.name); });
  } else if(currentSort === 'size'){
    list.sort(function(a,b){ return b.size - a.size; });
  } else if(currentSort === 'type'){
    list.sort(function(a,b){ return fileType(a.name).localeCompare(fileType(b.name)); });
  } else {
    list.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
  }

  var grid  = $('file-grid');
  var empty = $('empty-state');
  grid.innerHTML = '';

  if(list.length === 0){
    empty.style.display = 'block';
    renderStats();
    return;
  }
  empty.style.display = 'none';

  list.forEach(function(f, i){
    var card = document.createElement('div');
    card.className = 'file-card';
    card.style.setProperty('--i', i);

    var displayName = f.name.replace(/^\d{8}_/, ''); // strip date prefix for display
    var meta = fileType(f.name) + '  ·  ' + fmtSize(f.size);
    if(f.date && f.date !== new Date(0).toISOString()){
      meta += '  ·  ' + timeAgo(f.date);
    }

    card.innerHTML =
      '<span class="file-icon">' + fileIcon(f.name) + '</span>' +
      '<div class="file-info">' +
        '<div class="file-name">' + displayName + '</div>' +
        '<div class="file-meta">' + meta + '</div>' +
      '</div>' +
      '<div class="file-actions">' +
        '<button class="file-btn" title="Descargar" data-url="' + (f.download_url||'#') + '">⬇</button>' +
        '<button class="file-btn delete" title="Eliminar" data-name="' + f.name + '" data-sha="' + f.sha + '">🗑</button>' +
      '</div>';

    // Download
    card.querySelector('[title="Descargar"]').addEventListener('click', function(e){
      e.stopPropagation();
      var url = this.getAttribute('data-url');
      if(url && url !== '#') window.open(url, '_blank');
    });

    // Delete (opens confirm)
    card.querySelector('[title="Eliminar"]').addEventListener('click', function(e){
      e.stopPropagation();
      openConfirm(this.getAttribute('data-name'), this.getAttribute('data-sha'));
    });

    // Click card = download
    card.addEventListener('click', function(){
      var url = f.download_url;
      if(url) window.open(url, '_blank');
    });

    grid.appendChild(card);
  });

  renderStats();
}

function renderStats(){
  var total = allFiles.length;
  var totalSize = allFiles.reduce(function(s,f){ return s+f.size; }, 0);
  var types = {};
  allFiles.forEach(function(f){ types[fileType(f.name)] = 1; });
  var typeCount = Object.keys(types).length;

  $('st-total').textContent = total;
  $('st-size').textContent  = total > 0 ? fmtSize(totalSize) : '0 KB';
  $('st-types').textContent = typeCount > 0 ? typeCount : '—';
}

/* ══════════ SORT ══════════ */
window.setSort = function(s){
  currentSort = s;
  document.querySelectorAll('.sort-opt').forEach(function(el){
    el.classList.toggle('active', el.dataset.sort === s);
  });
  $('sort-menu').classList.remove('open');
  renderFiles();
};

$('btn-sort').addEventListener('click', function(e){
  e.stopPropagation();
  $('sort-menu').classList.toggle('open');
});
document.addEventListener('click', function(){
  $('sort-menu').classList.remove('open');
});

/* ══════════ SEARCH ══════════ */
var searchT = null;
$('search').addEventListener('input', function(){
  clearTimeout(searchT);
  searchT = setTimeout(renderFiles, 200);
});

/* ══════════ THEME ══════════ */
function applyTheme(light){
  document.documentElement.classList.toggle('light', light);
  localStorage.setItem('mf_theme', light ? 'light' : 'dark');
  $('meta-theme').setAttribute('content', light ? '#f5f3ee' : '#0f0f1a');
  $('btn-theme').textContent = light ? '◑' : '◐';
}
if(localStorage.getItem('mf_theme') === 'light') applyTheme(true);
$('btn-theme').addEventListener('click', function(){
  applyTheme(!document.documentElement.classList.contains('light'));
});

/* ══════════ DELETE CONFIRM ══════════ */
function openConfirm(name, sha){
  pendingDelete = { name: name, sha: sha };
  $('confirm-msg').textContent = '¿Eliminar "' + name.replace(/^\d{8}_/,'') + '"? Esta acción no se puede deshacer desde aquí.';
  $('confirm-overlay').classList.add('open');
}
window.closeConfirm = function(){
  $('confirm-overlay').classList.remove('open');
  pendingDelete = null;
};
$('confirm-ok').addEventListener('click', function(){
  if(!pendingDelete) return;
  // Signal to external tool via URL hash (the publisher reads this)
  // In the web-only context, we just close and note that deletion
  // must be done from the desktop publisher or directly on GitHub.
  closeConfirm();
  alert('Para eliminar archivos, usa el programa MyFiles en tu computadora o el panel de GitHub.');
});
$('confirm-overlay').addEventListener('click', function(e){
  if(e.target === this) closeConfirm();
});

/* ══════════ OFFLINE ══════════ */
function checkOnline(){
  $('offline-bar').classList.toggle('show', !navigator.onLine);
}
window.addEventListener('online',  checkOnline);
window.addEventListener('offline', checkOnline);
checkOnline();

/* ══════════ INIT ══════════ */
loadFiles();

})();
</script>
</body>
</html>
